  <text x="810" y="603" class="small bold">Pages</text><text x="920" y="603" class="small bold">Status</text><text x="1190" y="603" class="small bold">Action</text>
  <text x="120" y="655">12-1.pdf</text><text x="440" y="655">Table of contents</text><text x="810" y="655">8</text><text x="920" y="655" style="fill:#176864">Ready</text><text x="1190" y="655" class="link">Open</text>
  <line x1="96" y1="676" x2="1344" y2="676" stroke="#D8DEDE"/>
  <text x="120" y="709">12-2.pdf</text><text x="440" y="709">ALJ decision · Hearing transcript</text><text x="810" y="709">126</text><text x="920" y="709" style="fill:#176864">Ready</text><text x="1190" y="709" class="link">Open</text>
  <line x1="96" y1="730" x2="1344" y2="730" stroke="#D8DEDE"/>
  <text x="120" y="763">12-3.pdf</text><text x="440" y="763">Disability determination</text><text x="810" y="763">64</text><text x="920" y="763" style="fill:#176864">Ready</text><text x="1190" y="763" class="link">Open</text>
  <line x1="96" y1="784" x2="1344" y2="784" stroke="#D8DEDE"/>
  <text x="120" y="817">12-4.pdf</text><text x="440" y="817">Procedural documents</text><text x="810" y="817">83</text><text x="920" y="817">Checking citations</text><text x="1190" y="817" class="link">Details</text>
  <line x1="96" y1="838" x2="1344" y2="838" stroke="#D8DEDE"/>
  <text x="120" y="871">12-7.pdf</text><text x="440" y="871">Medical records</text><text x="810" y="871">84</text>
  <text x="920" y="862">Reading</text><text x="920" y="884" style="font-size:14px;fill:#80590D">2 pages need review</text><text x="1190" y="871" class="link">Review details</text>
  <line x1="96" y1="896" x2="1344" y2="896" stroke="#D8DEDE"/>
  <text x="120" y="929">12-8.pdf</text><text x="440" y="929" class="muted">Classification pending</text><text x="810" y="929">152</text><text x="920" y="929" class="muted">Queued</text>
  <text x="96" y="1003" class="small muted">Showing 6 of 14 documents</text><text x="1344" y="1003" text-anchor="end" class="link">Show all documents</text>
  <text x="1344" y="1050" text-anchor="end" class="small muted">Static design reference · fictional processing state</text>
</svg>
