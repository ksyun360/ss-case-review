<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1130" viewBox="0 0 980 1130" role="img" aria-labelledby="title description">
  <title id="title">Mobile chronology and source navigation</title>
  <desc id="description">Two 390-pixel mobile references show a medical entry followed by a full-screen source passage. The source screen preserves an explicit return action and originating-entry context.</desc>
  <defs><style>
    text { font-family:Arial, Helvetica, sans-serif; fill:#183247; font-size:16px; }
    .small { font-size:14px; } .muted { fill:#52636F; } .bold { font-weight:700; }
    .serif { font-family:Georgia, 'Times New Roman', serif; } .link { fill:#245C89; text-decoration:underline; }
  </style></defs>
  <rect width="980" height="1130" fill="#EDF0F1"/>
  <text x="48" y="46" style="font-size:20px;font-weight:700">Mobile review</text><text x="932" y="46" text-anchor="end" class="small muted">390 px content width · two sequential views</text>
  <text x="48" y="85" class="small bold">1. Select an entry’s source</text><text x="542" y="85" class="small bold">2. Read the passage and return</text>

  <g transform="translate(48 106)">
    <rect width="390" height="950" rx="12" fill="#F6F5F1" stroke="#7C8B94"/>
    <path d="M12 0h366q12 0 12 12v52H0V12Q0 0 12 0" fill="#FFFFFF"/>
    <path d="M23 18h15l6 6v22H23zM38 18v7h6M18 24v27h20M28 31h10M28 37h10" fill="none" stroke="#176864" stroke-width="1.8" stroke-linecap="round"/>
    <text x="59" y="41" class="serif bold" style="font-size:22px">Record Review</text><text x="324" y="39" class="small">Cases</text>
    <line x1="0" y1="64" x2="390" y2="64" stroke="#D8DEDE"/>
    <text x="16" y="101" class="small muted">DEMO-001 · Synthetic record</text>
    <text x="16" y="140" style="font-size:24px;font-weight:700">Taylor v. Commissioner</text>
    <text x="16" y="169" class="small muted">14 documents · 1,318 pages</text>
    <text x="16" y="209" class="small bold">Case section</text>
    <rect x="16" y="222" width="358" height="44" rx="8" fill="#FFFFFF" stroke="#7C8B94"/>
    <text x="30" y="250" class="bold" style="fill:#176864">Medical chronology</text><path d="M344 240l6 6 6-6" fill="none" stroke="#176864" stroke-width="2"/>
    <text x="16" y="305" class="small bold">Search entries</text>
    <rect x="16" y="317" width="261" height="44" rx="8" fill="#FFFFFF" stroke="#7C8B94"/><text x="29" y="345" class="muted">Find a term or provider</text>
    <rect x="289" y="317" width="85" height="44" rx="8" fill="#FFFFFF" stroke="#7C8B94"/><text x="331" y="345" text-anchor="middle">Filters</text>
    <text x="16" y="392" class="small muted">42 entries · Date, oldest first</text>
    <rect x="16" y="415" width="358" height="305" rx="8" fill="#FFFFFF" stroke="#D8DEDE"/>
    <rect x="16" y="433" width="4" height="69" fill="#176864"/>
    <text x="32" y="449" style="font-size:20px;font-weight:700">Jul 18, 2022</text><text x="32" y="478">Morgan Lee, MD</text>
    <text x="32" y="516" class="small muted">Reason for visit</text><text x="32" y="541">Follow-up: lower back pain</text>
    <text x="32" y="580" class="small muted">Prescription</text><text x="32" y="605">Naproxen 250 mg · new prescription</text>
    <rect x="32" y="628" width="326" height="44" rx="8" fill="#E9F1F7"/><text x="195" y="656" text-anchor="middle" class="link">Open source · Tr. 432 ↗</text>
    <text x="32" y="699" class="small" style="fill:#176864">Passage located</text><text x="358" y="699" text-anchor="end" class="small link">Entry details</text>
    <rect x="16" y="736" width="358" height="180" rx="8" fill="#FFFFFF" stroke="#D8DEDE"/>
    <text x="32" y="773" style="font-size:20px;font-weight:700">Aug 2, 2022</text><text x="32" y="802">Jordan Park, PT</text>
    <text x="32" y="840" class="small muted">Reason for visit</text><text x="32" y="865">Physical therapy</text><text x="32" y="895" class="small link">Open source · Tr. 448 ↗</text>
  </g>

  <path d="M463 573h43m-10-9l10 9-10 9" fill="none" stroke="#52636F" stroke-width="2"/>

  <g transform="translate(542 106)">
    <rect width="390" height="950" rx="12" fill="#FFFFFF" stroke="#7C8B94"/>
    <text x="16" y="40" class="link">‹ Back to medical chronology</text>
    <line x1="0" y1="64" x2="390" y2="64" stroke="#D8DEDE"/>
    <text x="16" y="104" style="font-size:24px;font-weight:700">Record source</text>
    <text x="16" y="134" class="small muted">12-7.pdf · PDF page 19 of 84</text><text x="16" y="160" class="small bold">Tr. 432 · Ex. 8F/12</text>
    <rect x="16" y="182" width="358" height="78" rx="8" fill="#E9F1F7"/>
    <text x="30" y="207" class="small bold">Originating entry</text><text x="30" y="234" class="small">Jul 18, 2022 · Morgan Lee, MD</text>
    <path d="M344 213l6 6 6-6" fill="none" stroke="#245C89" stroke-width="1.8"/>
    <text x="16" y="298" class="small">‹ Previous</text><text x="128" y="298" class="small">Next ›</text><text x="374" y="298" text-anchor="end" class="small">Fit width  −  +</text>
    <rect x="16" y="322" width="358" height="461" fill="#EDF0F1"/>
    <rect x="28" y="336" width="334" height="431" fill="#FFFFFF" stroke="#D8DEDE"/>
    <text x="43" y="365" style="font-size:11px;fill:#52636F">SYNTHETIC DOCUMENT · DESIGN REFERENCE</text>
    <text x="43" y="407" class="serif bold" style="font-size:22px">Clinical visit note</text>
    <text x="43" y="443" class="serif">July 18, 2022</text><text x="43" y="472" class="serif">Morgan Lee, MD</text>
    <text x="43" y="520" class="serif">Follow-up for lower back pain.</text>
    <rect x="37" y="542" width="313" height="103" fill="#FFF0B6"/><rect x="37" y="542" width="3" height="103" fill="#80590D"/>
    <text x="47" y="570" class="serif" style="font-size:18px">Plan: Start naproxen 250 mg</text>
    <text x="47" y="598" class="serif" style="font-size:18px">twice daily. Return for</text>
    <text x="47" y="626" class="serif" style="font-size:18px">follow-up in four weeks.</text>
    <text x="43" y="693" class="serif">Review the complete visit note.</text><text x="339" y="739" text-anchor="end" class="small muted">432</text>
    <circle cx="22" cy="814" r="4" fill="#176864"/><text x="36" y="820" class="small" style="fill:#176864">Passage located</text>
    <text x="16" y="853" class="small muted">Review the source context before relying</text><text x="16" y="876" class="small muted">on the extracted entry.</text>
    <rect x="16" y="894" width="358" height="44" rx="8" fill="#FFFFFF" stroke="#7C8B94"/><text x="195" y="922" text-anchor="middle" class="bold">View original document</text>
  </g>
  <text x="932" y="1100" text-anchor="end" class="small muted">Static design reference · fictional case and medical information</text>
</svg>
